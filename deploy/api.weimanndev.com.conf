# Install only after this hostname's TLS certificate exists.
# Dedicated virtual host: do not replace nginx.conf or Coderr's sites.
server {
    listen 80;
    server_name api.weimanndev.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portfolio-acme;
    }
    location / { return 301 https://api.weimanndev.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name api.weimanndev.com;
    ssl_certificate /etc/letsencrypt/live/api.weimanndev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.weimanndev.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/portfolio-api-error.log warn;
    client_max_body_size 24k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    location = /api/contact {
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host api.weimanndev.com;
        # Overwrite, never append client-provided forwarding headers.
        # Requires direct Internet -> Nginx; no upstream CDN/load balancer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_send_timeout 15s;
        proxy_request_buffering on;
    }
    location / { return 404; }
    error_page 413 = @too_large;
    error_page 502 503 504 = @unavailable;
    location @too_large {
        default_type application/json;
        add_header Access-Control-Allow-Origin https://weimanndev.com always;
        return 413 '{"error":"request_too_large"}';
    }
    location @unavailable {
        default_type application/json;
        add_header Access-Control-Allow-Origin https://weimanndev.com always;
        return 503 '{"error":"temporarily_unavailable"}';
    }
}
